name: Lightning watcher

on:
  schedule:
    # 18:15 UTC Mon & Wed = 2:15 PM EDT / 1:15 PM EST. Script waits until 3:00 PM itself.
    - cron: "15 18 * * 1,3"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = check once now, watch = full run"
        default: "test"
        type: choice
        options: [test, watch]

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event.inputs.mode || 'watch' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-screenshot
          path: widget.png
          if-no-files-found: ignore
